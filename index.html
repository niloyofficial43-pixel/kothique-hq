<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOTHIQUE HQ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <h1>KOTHIQUE</h1>
  <p>Every Voice Has a Story.</p>

  <div id="login">
    <h2>Welcome to KOTHIQUE HQ</h2>
    <p>Company Management System</p>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="message"></p>
  </div>

  <div id="dashboard" hidden>
    <h2>Chairman Dashboard</h2>
    <p id="userEmail"></p>
    <button id="logoutBtn">Logout</button>

    <hr>

    <h2>Team Management</h2>

    <input id="memberName" placeholder="Full Name">

    <select id="memberRole">
      <option value="">Select Position</option>
      <option value="Co-Founder">Co-Founder</option>
      <option value="CEO">CEO</option>
      <option value="Board Member">Board Member</option>
      <option value="Director of Finance">Director of Finance</option>
      <option value="Strategic Advisor">Strategic Advisor</option>
      <option value="Team Member">Team Member</option>
    </select>

    <input id="memberEmail" type="email" placeholder="Email (Optional)">
    <button id="addMemberBtn">Add Team Member</button>
    <p id="teamMessage"></p>

    <hr>

    <h2>Leadership</h2>
    <div id="leadershipList"></div>

    <hr>

    <h2>Board of Directors</h2>
    <div id="boardList"></div>

    <hr>

    <h2>Executive Team</h2>
    <div id="executiveList"></div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js?v=3"></script>

</body>
</html>
